name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Log in to Docker Hub
      run: echo "dckr_pat_609krlE7r267TkUKqfTeyJL8sbI" | docker login -u "tarzan123" --password-stdin

    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag tarzan123/mizanapp:latest

    - name: Push the Docker image
      run: docker push tarzan123/mizanapp:latest
