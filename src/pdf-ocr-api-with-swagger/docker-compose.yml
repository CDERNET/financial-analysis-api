services:
  pdfocr:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mssql
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Password123!
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
  