apiVersion: apps/v1
kind: Deployment
metadata:
  name: financial-analysis
  labels:
    app: financial-analysis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: financial-analysis
  template:
    metadata:
      labels:
        app: financial-analysis
    spec:
      containers:
      - name: financial-analysis
        image: your-registry.com/financial-analysis:latest  # CHANGE THIS!
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        # API configuration
        - name: API_HOST
          valueFrom:
            configMapKeyRef:
              name: financial-analysis-config
              key: API_HOST
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: financial-analysis-config
              key: API_PORT
        # File processing configuration
        - name: MAX_FILE_SIZE
          valueFrom:
            configMapKeyRef:
              name: financial-analysis-config
              key: MAX_FILE_SIZE
        - name: TESSERACT_LANG
          valueFrom:
            configMapKeyRef:
              name: financial-analysis-config
              key: TESSERACT_LANG
        - name: PDF_DPI
          valueFrom:
            configMapKeyRef:
              name: financial-analysis-config
              key: PDF_DPI
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: financial-analysis-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10