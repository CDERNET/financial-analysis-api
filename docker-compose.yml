services:
  # Trial Balance Extractor API
  trial-balance-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trial-balance-extractor
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    networks:
      - trial-balance-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  trial-balance-network:
    driver: bridge
