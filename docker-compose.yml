services:
  # Financial Analysis API
  financial-analysis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-analysis
    network_mode: host
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://postgres:xuAw6ZnolXFWfZHOuD2v@192.168.21.10:5432/FinancialRuleEngine
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
