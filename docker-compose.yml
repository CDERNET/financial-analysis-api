services:
  # Financial Analysis API
  financial-analysis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-analysis
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
    volumes:
      - ./logs:/app/logs
    networks:
      - financial-analysis-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  financial-analysis-network:
    driver: bridge
